
name: Build Unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project iOSToolbox.xcodeproj \
            -scheme iOSToolbox \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iOSToolbox.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload iOSToolbox-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOSToolbox-Unsigned-IPA
          path: iOSToolbox-unsigned.ipa
          if-no-files-found: error
