name: iOSToolbox
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"

targets:
  iOSToolbox:
    type: application
    platform: iOS
    sources:
      - path: iOSToolbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iostoolbox
        PRODUCT_NAME: iOSToolbox
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: iOS Toolbox
